# TRAMA — Crawler automatizado
# Archivo: .github/workflows/crawler.yml
#
# Corre el crawler cada 6 horas + permite disparo manual (workflow_dispatch),
# que usaremos como prueba de fuego: los runners de Actions tienen IPs de
# datacenter y algunos medios podrían bloquearlas (ya vimos 403 desde el
# entorno de Anthropic). La primera corrida manual nos dirá la verdad.
#
# Cadena de CUATRO jobs encadenados vía needs:
#   crawl → backfill → clustering → revincular
#  - crawl: ingesta de los 7 medios del banco.
#  - backfill: entidades + embedding. Idempotente (WHERE embedding IS NULL): si
#    falla, se re-corre solo en la siguiente vuelta sin daño. NO toca stories ni
#    contenido/hash.
#  - clustering: recompute total de stories (caché derivada pura). Necesita que
#    backfill haya corrido para que las noticias nuevas tengan embedding y entren
#    al clúster. Si backfill falla, no corre (no hay embeddings nuevos que agrupar;
#    el banco viejo espera sin daño). Recompute completo ~2 min, dominado por I/O
#    a Supabase, no por cómputo (el O(n²) es instantáneo a esta escala).
#  - revincular: repara las filas de resumenes_dia que la poda del clustering
#    dejó con story_id NULL. Ver el comentario del job.
#  - fase3: análisis LLM. NO corre en las cuatro vueltas — sólo en la de las
#    06:00 UTC. Ver el comentario del job.
#
# OJO CON EL CRON: GitHub deshabilita los workflows con `schedule` tras 60 días
# sin actividad en el repo, y avisa sólo por mail. Si eso pasa, el crawler deja
# de correr y las notas que el feed rota no vuelven nunca — categoría "pérdida
# permanente de archivo". Mientras haya commits regulares no aplica.
name: crawler
on:
  schedule:
    # DOS entradas de cron, no una, y es a propósito: `github.event.schedule`
    # devuelve el string del cron que disparó la corrida, así que partirlas es
    # la única forma de que un job distinga en cuál de las cuatro vueltas está.
    # Con el cron unificado "0 0,6,12,18 * * *" las cuatro se ven idénticas.
    # Colombia es UTC-5.
    - cron: "0 0,12,18 * * *"   # 19:00, 07:00 y 13:00 hora CO — sin Fase 3
    - cron: "0 6 * * *"         # 01:00 hora CO — ésta SÍ corre Fase 3
  workflow_dispatch:
    inputs:
      correr_fase3:
        description: "Correr también el análisis de Fase 3 (gasta LLM)"
        required: false
        default: false
        type: boolean
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # red de seguridad: si algo se cuelga, lo mata
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # fijamos 3.12 (probaste local en 3.14; 3.12 es la estable para CI)
      - name: Instalar dependencias
        working-directory: crawler
        run: pip install -r requirements.txt
      - name: Correr crawler
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crawler.py
  backfill:
    needs: crawl            # solo si la ingesta tuvo éxito; si no, no hay nada nuevo que embeber
    runs-on: ubuntu-latest
    timeout-minutes: 20     # 1ª corrida fría ~5-8 min (descargas); con caché, tibia ~2-3 min
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements-backfill.txt
      - name: Caché modelo HuggingFace (sentence-transformers)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Clave estática: el modelo (MiniLM-L12-v2) está hardcodeado en backfill_fase2.py
          # y no cambia. Si algún día cambias el modelo en el .py, sube el sufijo (v2, v3...).
          key: hf-${{ runner.os }}-minilm-l12-v2
      - name: Instalar torch CPU-only
        # Sin esto pip trae el build CUDA (~2GB) en un runner sin GPU. CPU basta y cachea.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Instalar dependencias backfill
        working-directory: crawler
        run: pip install -r requirements-backfill.txt
      - name: Correr backfill
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python backfill_fase2.py
  clustering:
    needs: backfill         # necesita embeddings frescos; si backfill falla, no hay nada nuevo que agrupar
    runs-on: ubuntu-latest
    timeout-minutes: 10     # corrida sana ~2 min (I/O a Supabase); 10 = margen para atrapar cuelgues reales
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias (ligeras — clustering NO usa torch/spaCy, solo lee embeddings y hace coseno en numpy; networkx es puro Python, para el split de beats por Louvain)
        run: pip install numpy supabase python-dotenv networkx
      - name: Reclusterizar (recompute total — stories es caché derivada pura, se borra y reconstruye)
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python clustering_fase2.py
  # Repara las filas de resumenes_dia que la poda de stories dejó con story_id
  # NULL. El análisis ya está pagado; sin esto queda invisible en la web.
  #
  # `needs: clustering` NO es una preferencia de orden, es una condición de
  # corrección: revincular_huerfanas.py lee story_articles, y
  # clustering_fase2.reescribir_stories() BORRA ESA TABLA ENTERA antes de
  # reconstruirla. Corriendo en paralelo leería una tabla vacía y concluiría que
  # ninguna huérfana tiene story actual — un no-op silencioso, que es la peor
  # clase de falla. Con `needs` sólo arranca si el clustering terminó OK.
  #
  # Barato a propósito: sólo lee y escribe Supabase. Sin torch, sin LLM, sin
  # modelos. Segundos, no minutos.
  revincular:
    needs: clustering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias (mínimas)
        run: pip install supabase python-dotenv
      - name: Re-vincular huérfanas de resumenes_dia
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
        # --verbose imprime cada fila NO re-vinculada y su motivo. Es el único
        # registro de por qué una huérfana sigue huérfana: sin esto, el conteo
        # de "repartidas" crecería sin que nadie sepa cuáles ni por qué.
        run: python revincular_huerfanas.py --aplicar --verbose

  # Análisis LLM de Fase 3 sobre las historias activas de las últimas 24 h.
  #
  # POR QUÉ UNA VEZ AL DÍA Y NO CUATRO: es el único job que cuesta dinero
  # (~$0,062 por día denso corroborado). Medido el 2026-08-24: una vuelta del
  # pipeline con ~1 h de material nuevo regeneró 2 días. Eso NO autoriza a
  # correrlo 4×/día — se midió con una hora de material, no seis, así que es
  # cota inferior. Una vuelta diaria acota el gasto mientras se acumula la
  # medición real. Subir a más vueltas es una decisión posterior CON el dato.
  #
  # POR QUÉ `needs: revincular` Y NO `needs: clustering`: revincular recupera
  # días que ya estaban analizados y pagados. Si Fase 3 corriera antes, los
  # regeneraría pagando LLM de nuevo. Medido en el mismo experimento: revincular
  # recuperó 12 días que Fase 3 habría vuelto a pagar. El orden es económico,
  # no cosmético.
  #
  # ⚠️ EL `if` COMPARA EL STRING DEL CRON CARÁCTER POR CARÁCTER. Si algún día
  # editás "0 6 * * *" arriba y no acá, este job deja de correr EN SILENCIO —
  # sin error, sin log, sin nada. Los dos valores se cambian juntos o no se
  # cambia ninguno. Verificación: en Actions, la corrida de las 06:00 UTC debe
  # mostrar cinco jobs; las otras tres, cuatro.
  fase3:
    needs: revincular
    if: github.event.schedule == '0 6 * * *' || inputs.correr_fase3
    runs-on: ubuntu-latest
    timeout-minutes: 70          # colchón sobre el presupuesto de 3600s
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar deps mínimas de Fase 3
        run: pip install requests python-dotenv supabase
      - name: Analizar historias activas (24h)
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONUNBUFFERED: "1"
        # --presupuesto 3600 (1h) en vez de los 19800 del backfill manual: corriendo
        # a diario no debería haber backlog. Si lo hay, corta limpio y lo retoma
        # mañana — el caché por dia_key hace que no repita lo ya guardado. Es una
        # cota de TIEMPO, no de dinero: un tope explícito de días guardados sería
        # la cota real y va a Ideas, no acá.
        run: python analisis_fase3.py --backfill --horas 24 --presupuesto 3600
